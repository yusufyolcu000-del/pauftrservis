<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Servis">
<link rel="manifest" href="manifest.webmanifest">
<title>Servis Listesi</title>
<style>
:root{
  --page:#e9edf1; --surface:#fff; --surface-2:#f2f5f8;
  --ink:#152029; --ink-2:#4b5d6e; --ink-3:#7d8fa0;
  --line:#d6dee6; --line-2:#c2ccd6;
  --accent:#0f5f5c; --accent-ink:#fff; --accent-soft:#dceceb;
  --warn:#9a3412; --warn-soft:#fbe8de;
  --ok:#166534;
  --radius:7px; --shadow:0 1px 2px rgba(20,35,48,.06),0 6px 18px rgba(20,35,48,.07);
  --font:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0d141b; --surface:#151f29; --surface-2:#1b2732;
  --ink:#e4ecf4; --ink-2:#a6b6c6; --ink-3:#7a8b9b;
  --line:#26333f; --line-2:#32424f;
  --accent:#4fd0c4; --accent-ink:#06211f; --accent-soft:#12312f;
  --warn:#f0a58a; --warn-soft:#3a2119; --ok:#7bd49a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app{display:none;height:100%;flex-direction:column}
.app.on{display:flex}
.topbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.spacer{flex:1}
.sync{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.sync.busy{color:var(--accent)} .sync.err{color:var(--warn)} .sync.off{color:var(--warn);font-weight:500}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:7px 9px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 9px;font-size:13.5px}

.panes{flex:1;display:grid;grid-template-columns:minmax(290px,340px) 1fr;min-height:0}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.detail{min-height:0;overflow:auto;background:var(--page)}

.filters{padding:9px 11px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.filters input[type="search"]{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface-2)}
.segs{display:flex;gap:6px}
.seg{flex:1;padding:6px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface-2);cursor:pointer;font-size:13.5px}
.seg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}

.rows{overflow:auto;flex:1;min-height:0}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .l1{display:flex;align-items:baseline;gap:8px}
.oda{font-weight:700;letter-spacing:-.01em;min-width:52px}
.kim{color:var(--ink-2);font-size:14px}
.gun{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.row .l2{font-size:13.5px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l3{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.tag.iş{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.tag.bek{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.empty{padding:34px 20px;color:var(--ink-3);text-align:center;font-size:14px}

.editor{max-width:820px;margin:0 auto;padding:16px 14px 70px}
.ed-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ed-head h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.015em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.sechead{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 9px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.grid .half{grid-column:span 2} .grid .full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface-2)}
textarea{resize:vertical;min-height:74px;line-height:1.55}
.blok{border-left:2px solid var(--line-2);padding:2px 0 2px 10px;margin-bottom:9px}
.blok .d{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.blok .m{white-space:pre-wrap;font-size:14px}
.blok.bekliyor{border-left-color:var(--warn)}
.is{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)}
.is input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
.is span{flex:1}
.is.ok span{text-decoration:line-through;color:var(--ink-3)}
.addline{display:flex;gap:7px;margin-top:9px}
.addline input,.addline textarea{flex:1}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid currentColor;border-radius:var(--radius);padding:9px 12px;font-size:13.5px;margin-bottom:11px}

/* vizit modu */
.vizit{position:fixed;inset:0;background:var(--page);z-index:60;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vizit.on{display:flex}
.vizit .vbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.vizit .vbody{flex:1;overflow:auto;padding:16px 16px 40px}
.vizit .vnav{display:flex;gap:8px;padding:9px 12px;background:var(--surface);border-top:1px solid var(--line)}
.vizit .vnav .btn{flex:1;padding:12px}
.vw{max-width:780px;margin:0 auto;font-size:16.5px}
.vw h2{font-size:23px;margin:0 0 2px;letter-spacing:-.02em}
.vw .alt{color:var(--ink-2);margin-bottom:14px}
.vw section{margin-bottom:15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.vw h3{font-size:12.5px;text-transform:none;color:var(--ink-3);font-weight:600;margin:0 0 5px}
.vw p{margin:0;white-space:pre-wrap}
.vw .bek{color:var(--warn);font-weight:600}

.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .box{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:var(--shadow)}
.gate h1{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
.gate p.sub{margin:0 0 18px;color:var(--ink-2);font-size:14px}
.gate .field{margin-bottom:11px}
.gate .btn{width:100%;padding:10px;margin-top:6px}
.msg{font-size:13.5px;margin-top:10px;color:var(--warn)} .msg.ok{color:var(--ok)}
.alt2{margin-top:14px;font-size:13.5px;color:var(--ink-2);text-align:center}
.alt2 a{color:var(--accent);cursor:pointer}

.backbtn{display:none}
@media (max-width:880px){
  .panes{grid-template-columns:1fr}
  .list{border-right:0}
  body[data-view="detail"] .list{display:none}
  body[data-view="list"] .detail{display:none}
  body[data-view="detail"] .backbtn{display:inline-flex}
  .grid{grid-template-columns:repeat(2,1fr)}
  .grid .half{grid-column:span 1}
  .editor{padding:13px 11px 76px}
}
</style>
</head>
<body data-view="list">

<div class="gate" id="setupGate" style="display:none">
  <div class="box">
    <h1>Bağlantı bilgileri</h1>
    <p class="sub">Supabase projenin adresi ve anon anahtarı. Her cihazda bir kez girilir, bu tarayıcıda saklanır.</p>
    <div class="field"><label for="cfgUrl">Proje adresi</label><input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></div>
    <div class="field"><label for="cfgKey">Anon anahtarı</label><input type="text" id="cfgKey" placeholder="eyJhbGciOi..." autocomplete="off"></div>
    <button class="btn primary" id="cfgSave">Bağlan</button>
    <div class="msg" id="cfgMsg"></div>
  </div>
</div>

<div class="gate" id="authGate" style="display:none">
  <div class="box">
    <h1>Servis Listesi</h1>
    <p class="sub" id="authSub">Kayıtlarına ulaşmak için giriş yap.</p>
    <div class="field"><label for="email">E-posta</label><input type="text" id="email" autocomplete="username" inputmode="email"></div>
    <div class="field"><label for="pass">Parola</label><input type="password" id="pass" autocomplete="current-password"></div>
    <button class="btn primary" id="doAuth">Giriş yap</button>
    <div class="msg" id="authMsg"></div>
    <div class="alt2"><a id="toggleMode">Hesabım yok, oluştur</a> · <a id="resetCfg">bağlantıyı değiştir</a></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <button class="btn ghost backbtn" id="back" aria-label="Listeye dön">‹ Liste</button>
    <div class="brand">Servis</div>
    <div class="spacer"></div>
    <div class="sync" id="sync"></div>
    <button class="btn sm" id="vizitBtn">Vizit</button>
    <button class="btn primary sm" id="new">+ Hasta</button>
    <button class="btn ghost sm" id="menu" aria-label="Hesap">⋯</button>
  </div>
  <div class="panes">
    <aside class="list">
      <div class="filters">
        <input type="search" id="q" placeholder="Ara: oda, kod, tanı, not…" autocomplete="off">
        <div class="segs">
          <button class="seg on" data-d="yatan">Yatanlar</button>
          <button class="seg" data-d="taburcu">Taburcu</button>
          <button class="seg" data-d="hepsi">Hepsi</button>
        </div>
        <div class="hint" id="count"></div>
      </div>
      <div class="rows" id="rows"></div>
    </aside>
    <main class="detail" id="detail"><div class="empty" style="padding-top:56px">Soldan hasta seç ya da yeni hasta ekle.</div></main>
  </div>
</div>

<div class="vizit" id="vizit">
  <div class="vbar">
    <button class="btn ghost" id="vClose">✕ Kapat</button>
    <div class="spacer"></div>
    <div class="sync" id="vPos"></div>
    <button class="btn sm" id="vEdit">Düzenle</button>
  </div>
  <div class="vbody" id="vBody"></div>
  <div class="vnav">
    <button class="btn" id="vPrev">‹ Önceki</button>
    <button class="btn" id="vNext">Sonraki ›</button>
  </div>
</div>

<script src="supabase.js"></script>
<script>
(function(){
"use strict";

var SUPABASE_URL = "";      // istersen buraya sabitle
var SUPABASE_ANON_KEY = "";

var $ = function(i){ return document.getElementById(i); };
var sb=null, user=null, rows=[], currentId=null, draft=null, isNew=false;
var saveTimer=null, signUpMode=false, durumFilt="yatan", vizitIdx=0, online=navigator.onLine;
var CK="", OK_="";   // cache / outbox anahtarları

function uid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
    var r=Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16);
  });
}
function today(){ return new Date().toISOString().slice(0,10); }
function trDate(s){ if(!s) return ""; var p=String(s).slice(0,10).split("-"); return p.length===3?p[2]+"."+p[1]+"."+p[0]:s; }
function gun(s){ if(!s) return ""; var d=Math.floor((Date.now()-new Date(s+"T00:00:00").getTime())/86400000)+1; return d>0?d+". gün":""; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- yerel depo ---------- */
function cacheGet(){ try{ return JSON.parse(localStorage.getItem(CK)||"[]"); }catch(e){ return []; } }
function cacheSet(v){ try{ localStorage.setItem(CK, JSON.stringify(v)); }catch(e){} }
function obGet(){ try{ return JSON.parse(localStorage.getItem(OK_)||"[]"); }catch(e){ return []; } }
function obSet(v){ try{ localStorage.setItem(OK_, JSON.stringify(v)); }catch(e){} }
function obPush(op){
  var o = obGet().filter(function(x){ return x.id !== op.id; });
  o.push(op); obSet(o); setSync();
}

/* ---------- bağlantı ---------- */
function cfg(){
  var u=SUPABASE_URL||localStorage.getItem("sl_url")||"", k=SUPABASE_ANON_KEY||localStorage.getItem("sl_key")||"";
  return u&&k?{url:u.replace(/\/+$/,""),key:k}:null;
}
function boot(){
  var c=cfg();
  if(!c){ $("setupGate").style.display="flex"; return; }
  if(!window.supabase){ $("setupGate").style.display="flex"; $("cfgMsg").textContent="supabase.js dosyası yüklenemedi — aynı klasörde olduğundan emin ol."; return; }
  try{ sb=window.supabase.createClient(c.url,c.key); }
  catch(e){ localStorage.removeItem("sl_url"); localStorage.removeItem("sl_key"); $("setupGate").style.display="flex"; $("cfgMsg").textContent="Adres geçersiz. Tekrar dene."; return; }
  sb.auth.getSession().then(function(r){
    if(r.data&&r.data.session) start(r.data.session.user);
    else $("authGate").style.display="flex";
  }).catch(function(){ $("authGate").style.display="flex"; });
}
$("cfgSave").onclick=function(){
  var u=$("cfgUrl").value.trim(), k=$("cfgKey").value.trim();
  if(!/^https:\/\/.+/.test(u)||k.length<20){ $("cfgMsg").textContent="Adres https:// ile başlamalı, anahtar eksik."; return; }
  localStorage.setItem("sl_url",u); localStorage.setItem("sl_key",k);
  $("setupGate").style.display="none"; boot();
};
$("resetCfg").onclick=function(){ localStorage.removeItem("sl_url"); localStorage.removeItem("sl_key"); location.reload(); };
$("toggleMode").onclick=function(){
  signUpMode=!signUpMode;
  $("doAuth").textContent=signUpMode?"Hesap oluştur":"Giriş yap";
  $("toggleMode").textContent=signUpMode?"Hesabım var, giriş yap":"Hesabım yok, oluştur";
  $("authMsg").textContent="";
};
$("doAuth").onclick=function(){
  var em=$("email").value.trim(), pw=$("pass").value;
  if(!em||!pw){ $("authMsg").textContent="E-posta ve parola gerekli."; return; }
  $("doAuth").disabled=true; $("authMsg").className="msg"; $("authMsg").textContent="…";
  (signUpMode?sb.auth.signUp({email:em,password:pw}):sb.auth.signInWithPassword({email:em,password:pw}))
  .then(function(r){
    $("doAuth").disabled=false;
    if(r.error){ $("authMsg").textContent=r.error.message; return; }
    if(r.data.session){ $("authGate").style.display="none"; start(r.data.session.user); }
    else { $("authMsg").className="msg ok"; $("authMsg").textContent="E-postana doğrulama bağlantısı gitti."; }
  });
};
$("pass").addEventListener("keydown",function(e){ if(e.key==="Enter") $("doAuth").click(); });

/* ---------- başlat ---------- */
function start(u){
  user=u; CK="sl_cache_"+u.id; OK_="sl_outbox_"+u.id;
  $("app").classList.add("on");
  rows=cacheGet(); sortRows(); render();          // önce yerelden, anında
  setSync();
  window.addEventListener("online", function(){ online=true; setSync(); flush().then(pull); });
  window.addEventListener("offline", function(){ online=false; setSync(); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && navigator.onLine) flush().then(pull); });
  setInterval(function(){ if(navigator.onLine) flush(); }, 20000);
  if(navigator.onLine) flush().then(pull);
  try{
    sb.channel("hastalar-sync").on("postgres_changes",{event:"*",schema:"public",table:"hastalar"},onRemote).subscribe();
  }catch(e){}
}

/* ---------- senkron ---------- */
function pull(){
  if(!navigator.onLine) return Promise.resolve();
  setSync("Yenileniyor…","busy");
  return sb.from("hastalar").select("*").then(function(r){
    if(r.error){ setSync("Sunucuya ulaşılamadı","err"); return; }
    var pend={}; obGet().forEach(function(o){ pend[o.id]=1; });
    var map={}; rows.forEach(function(n){ map[n.id]=n; });
    (r.data||[]).forEach(function(s){ if(!pend[s.id]) map[s.id]=s; });
    var ids={}; (r.data||[]).forEach(function(s){ ids[s.id]=1; });
    rows = Object.keys(map).map(function(k){ return map[k]; })
                 .filter(function(n){ return ids[n.id] || pend[n.id]; });
    sortRows(); cacheSet(rows); setSync(); render();
    if(draft && currentId && !dirty()){ var f=rows.find(function(n){return n.id===currentId;}); if(f){ draft=clone(f); renderEditor(); } }
  }).catch(function(){ setSync("Sunucuya ulaşılamadı","err"); });
}
function flush(){
  var q=obGet();
  if(!q.length || !navigator.onLine){ setSync(); return Promise.resolve(); }
  setSync("Gönderiliyor…","busy");
  var chain=Promise.resolve();
  q.forEach(function(op){
    chain=chain.then(function(){
      var p = op.op==="delete"
        ? sb.from("hastalar").delete().eq("id",op.id)
        : sb.from("hastalar").upsert(op.body);
      return p.then(function(r){
        if(!r.error){ obSet(obGet().filter(function(x){ return !(x.id===op.id && x.ts===op.ts); })); }
      });
    });
  });
  return chain.then(function(){ setSync(); }).catch(function(){ setSync("Gönderilemedi","err"); });
}
function onRemote(p){
  var row=p.new&&p.new.id?p.new:p.old; if(!row) return;
  var pend={}; obGet().forEach(function(o){ pend[o.id]=1; });
  if(pend[row.id]) return;
  if(p.eventType==="DELETE"){
    rows=rows.filter(function(n){ return n.id!==row.id; });
    if(currentId===row.id){ currentId=null; draft=null; renderEditor(); }
  }else{
    var i=rows.findIndex(function(n){ return n.id===row.id; });
    if(i>=0) rows[i]=p.new; else rows.push(p.new);
    if(currentId===row.id && draft && !dirty()){ draft=clone(p.new); renderEditor(); }
  }
  sortRows(); cacheSet(rows); render();
}
function setSync(t,cls){
  var s=$("sync"), n=obGet().length;
  if(t){ s.textContent=t; s.className="sync "+(cls||""); return; }
  if(!navigator.onLine){ s.textContent="Çevrimdışı"+(n?" · "+n+" bekliyor":""); s.className="sync off"; return; }
  if(n){ s.textContent=n+" bekliyor"; s.className="sync busy"; return; }
  s.textContent="Eşitlendi"; s.className="sync";
}

/* ---------- liste ---------- */
function sortRows(){
  rows.sort(function(a,b){
    if(a.durum!==b.durum) return a.durum==="yatan"?-1:1;
    return String(a.oda||"zz").localeCompare(String(b.oda||"zz"),"tr",{numeric:true});
  });
}
function bekleyen(n){ return (n.isler||[]).filter(function(i){ return !i.ok; }).length; }
function bekKons(n){ return (n.konsultasyonlar||[]).filter(function(k){ return !k.c; }).length; }
function filtered(){
  var q=$("q").value.trim().toLocaleLowerCase("tr");
  return rows.filter(function(n){
    if(durumFilt!=="hepsi" && (n.durum||"yatan")!==durumFilt) return false;
    if(!q) return true;
    return [n.oda,n.hasta_kodu,n.tani,n.oyku,n.tedavi,n.ftr_program,n.islemler,
            JSON.stringify(n.vizitler||[]),JSON.stringify(n.lablar||[])]
      .join(" ").toLocaleLowerCase("tr").indexOf(q)>=0;
  });
}
function render(){
  var list=filtered(), box=$("rows");
  $("count").textContent=list.length+" hasta";
  box.innerHTML="";
  if(!list.length){
    var e=document.createElement("div"); e.className="empty";
    e.textContent=rows.length?"Bu filtreye uyan hasta yok.":"Liste boş. Sağ üstten hasta ekle.";
    box.appendChild(e); return;
  }
  var frag=document.createDocumentFragment();
  list.forEach(function(n){
    var b=document.createElement("button"); b.className="row"; b.type="button";
    if(n.id===currentId) b.setAttribute("aria-current","true");
    var l1=document.createElement("div"); l1.className="l1";
    var o=document.createElement("span"); o.className="oda"; o.textContent=n.oda||"—";
    var k=document.createElement("span"); k.className="kim";
    k.textContent=[n.hasta_kodu,(n.yas?n.yas:"")+(n.cinsiyet?"/"+n.cinsiyet:"")].filter(Boolean).join(" ");
    var g=document.createElement("span"); g.className="gun"; g.textContent=n.durum==="taburcu"?"taburcu":gun(n.yatis_tarihi);
    l1.appendChild(o); l1.appendChild(k); l1.appendChild(g);
    var l2=document.createElement("div"); l2.className="l2"; l2.textContent=n.tani||"—";
    var l3=document.createElement("div"); l3.className="l3";
    var bi=bekleyen(n), bk=bekKons(n);
    if(bi){ var t1=document.createElement("span"); t1.className="tag iş"; t1.textContent=bi+" iş"; l3.appendChild(t1); }
    if(bk){ var t2=document.createElement("span"); t2.className="tag bek"; t2.textContent=bk+" konsültasyon bekliyor"; l3.appendChild(t2); }
    if(n.ftr_program){ var t3=document.createElement("span"); t3.className="tag"; t3.textContent="FTR"; l3.appendChild(t3); }
    b.appendChild(l1); b.appendChild(l2); if(l3.children.length) b.appendChild(l3);
    b.onclick=function(){ open(n.id); };
    frag.appendChild(b);
  });
  box.appendChild(frag);
}
$("q").addEventListener("input",render);
Array.prototype.forEach.call(document.querySelectorAll(".seg"),function(s){
  s.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll(".seg"),function(x){ x.classList.remove("on"); });
    s.classList.add("on"); durumFilt=s.dataset.d; render();
  };
});

/* ---------- editör ---------- */
function blank(){
  return {id:uid(),user_id:user.id,oda:"",hasta_kodu:"",yas:null,cinsiyet:"",yatis_tarihi:today(),
    durum:"yatan",taburcu_tarihi:null,tani:"",oyku:"",tedavi:"",ftr_program:"",islemler:"",
    lablar:[],konsultasyonlar:[],vizitler:[],isler:[]};
}
function dirty(){
  if(!draft) return false;
  var o=rows.find(function(n){ return n.id===draft.id; });
  if(!o) return true;
  return JSON.stringify(payload(o))!==JSON.stringify(payload(draft));
}
function payload(d){
  return {id:d.id,user_id:user.id,oda:d.oda||"",hasta_kodu:d.hasta_kodu||"",
    yas:(d.yas===""||d.yas==null)?null:+d.yas,cinsiyet:d.cinsiyet||"",
    yatis_tarihi:d.yatis_tarihi||null,durum:d.durum||"yatan",taburcu_tarihi:d.taburcu_tarihi||null,
    tani:d.tani||"",oyku:d.oyku||"",tedavi:d.tedavi||"",ftr_program:d.ftr_program||"",islemler:d.islemler||"",
    lablar:d.lablar||[],konsultasyonlar:d.konsultasyonlar||[],vizitler:d.vizitler||[],isler:d.isler||[]};
}
function open(id){
  var n=rows.find(function(x){ return x.id===id; }); if(!n) return;
  currentId=id; draft=clone(n); isNew=false;
  document.body.dataset.view="detail"; renderEditor(); render();
}
$("new").onclick=function(){
  draft=blank(); currentId=draft.id; isNew=true;
  rows.push(clone(draft)); sortRows(); cacheSet(rows);
  document.body.dataset.view="detail"; renderEditor(); render();
  var f=document.querySelector('[data-f="oda"]'); if(f) f.focus();
};
$("back").onclick=function(){ document.body.dataset.view="list"; };

function field(label,key,type,opts){
  var w=document.createElement("div"), l=document.createElement("label"), el;
  l.textContent=label;
  if(type==="select"){
    el=document.createElement("select");
    opts.forEach(function(v){ var o=document.createElement("option"); o.value=v; o.textContent=v===""?"—":v; el.appendChild(o); });
    el.value=draft[key]||"";
  }else if(type==="textarea"){
    el=document.createElement("textarea"); el.value=draft[key]||"";
    if(opts&&opts.rows) el.rows=opts.rows;
    if(opts&&opts.ph) el.placeholder=opts.ph;
  }else{
    el=document.createElement("input"); el.type=type;
    if(type==="number"){ el.min=0; el.max=120; el.inputMode="numeric"; }
    el.value=(draft[key]==null)?"":draft[key];
    if(opts&&opts.ph) el.placeholder=opts.ph;
  }
  el.dataset.f=key;
  el.addEventListener("input",function(){ draft[key]=el.value; queueSave(); });
  w.appendChild(l); w.appendChild(el); return w;
}
function blokListe(arr,key,label,ph){
  var c=document.createElement("div"); c.className="card";
  var h=document.createElement("div"); h.className="sechead"; h.textContent=label; c.appendChild(h);
  (arr||[]).slice().reverse().forEach(function(t,ri){
    var i=arr.length-1-ri;
    var b=document.createElement("div"); b.className="blok";
    var d=document.createElement("div"); d.className="d";
    var ds=document.createElement("span"); ds.textContent=trDate(t.t);
    var rm=document.createElement("button"); rm.className="btn ghost sm"; rm.textContent="kaldır";
    rm.onclick=function(){ draft[key].splice(i,1); queueSave(true); renderEditor(); };
    d.appendChild(ds); d.appendChild(rm);
    var m=document.createElement("div"); m.className="m"; m.textContent=t.m;
    b.appendChild(d); b.appendChild(m); c.appendChild(b);
  });
  var ta=document.createElement("textarea"); ta.rows=3; ta.placeholder=ph;
  var add=document.createElement("button"); add.className="btn sm"; add.textContent="Ekle"; add.style.marginTop="8px";
  add.onclick=function(){
    var v=ta.value.trim(); if(!v) return;
    draft[key]=draft[key]||[]; draft[key].push({t:today(),m:v}); ta.value="";
    queueSave(true); renderEditor();
  };
  c.appendChild(ta); c.appendChild(add);
  return c;
}
function renderEditor(){
  var d=$("detail"); d.innerHTML="";
  if(!draft){ var e=document.createElement("div"); e.className="empty"; e.style.paddingTop="56px"; e.textContent="Soldan hasta seç ya da yeni hasta ekle."; d.appendChild(e); return; }
  var wrap=document.createElement("div"); wrap.className="editor";

  var head=document.createElement("div"); head.className="ed-head";
  var h=document.createElement("h1");
  h.textContent=(draft.oda?draft.oda+" · ":"")+(draft.hasta_kodu||"Yeni hasta");
  var sp=document.createElement("div"); sp.className="spacer";
  head.appendChild(h); head.appendChild(sp);
  var tb=document.createElement("button"); tb.className="btn sm";
  tb.textContent=draft.durum==="taburcu"?"Yatışa al":"Taburcu et";
  tb.onclick=function(){
    if(draft.durum==="taburcu"){ draft.durum="yatan"; draft.taburcu_tarihi=null; }
    else { draft.durum="taburcu"; draft.taburcu_tarihi=today(); }
    queueSave(true); renderEditor(); render();
  };
  var del=document.createElement("button"); del.className="btn sm danger"; del.textContent="Sil"; del.onclick=removeRow;
  head.appendChild(tb); head.appendChild(del);
  wrap.appendChild(head);

  var c1=document.createElement("div"); c1.className="card";
  var g=document.createElement("div"); g.className="grid";
  g.appendChild(field("Oda-yatak","oda","text",{ph:"302-A"}));
  g.appendChild(field("Hasta kodu","hasta_kodu","text",{ph:"A.Y."}));
  g.appendChild(field("Yaş","yas","number"));
  g.appendChild(field("Cinsiyet","cinsiyet","select",["","K","E"]));
  g.appendChild(field("Yatış tarihi","yatis_tarihi","date"));
  var t=field("Tanı / yatış nedeni","tani","text"); t.className="half"; g.appendChild(t);
  var oy=field("Özet öykü","oyku","textarea",{rows:3}); oy.className="full"; g.appendChild(oy);
  c1.appendChild(g); wrap.appendChild(c1);

  var c2=document.createElement("div"); c2.className="card";
  var g2=document.createElement("div"); g2.className="grid";
  var a=field("Tedavi / ilaçlar","tedavi","textarea",{rows:4}); a.className="half"; g2.appendChild(a);
  var b=field("FTR programı","ftr_program","textarea",{rows:4,ph:"Modalite, seans"}); b.className="half"; g2.appendChild(b);
  var c=field("Yapılan işlemler","islemler","textarea",{rows:3}); c.className="full"; g2.appendChild(c);
  c2.appendChild(g2); wrap.appendChild(c2);

  /* bekleyen işler */
  var c3=document.createElement("div"); c3.className="card";
  var h3=document.createElement("div"); h3.className="sechead"; h3.textContent="Bekleyen işler"; c3.appendChild(h3);
  (draft.isler||[]).forEach(function(it,i){
    var r=document.createElement("label"); r.className="is"+(it.ok?" ok":"");
    var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!it.ok;
    cb.onchange=function(){ draft.isler[i].ok=cb.checked; queueSave(true); renderEditor(); render(); };
    var s=document.createElement("span"); s.textContent=it.m;
    var rm=document.createElement("button"); rm.className="btn ghost sm"; rm.textContent="×";
    rm.onclick=function(ev){ ev.preventDefault(); draft.isler.splice(i,1); queueSave(true); renderEditor(); render(); };
    r.appendChild(cb); r.appendChild(s); r.appendChild(rm); c3.appendChild(r);
  });
  var al=document.createElement("div"); al.className="addline";
  var ai=document.createElement("input"); ai.type="text"; ai.placeholder="Yeni iş…";
  var ab=document.createElement("button"); ab.className="btn sm"; ab.textContent="Ekle";
  var addIs=function(){ var v=ai.value.trim(); if(!v) return; draft.isler=draft.isler||[]; draft.isler.push({m:v,ok:false}); ai.value=""; queueSave(true); renderEditor(); render(); };
  ab.onclick=addIs; ai.addEventListener("keydown",function(e){ if(e.key==="Enter") addIs(); });
  al.appendChild(ai); al.appendChild(ab); c3.appendChild(al);
  wrap.appendChild(c3);

  /* konsültasyonlar */
  var c4=document.createElement("div"); c4.className="card";
  var h4=document.createElement("div"); h4.className="sechead"; h4.textContent="Konsültasyonlar"; c4.appendChild(h4);
  (draft.konsultasyonlar||[]).forEach(function(k,i){
    var bl=document.createElement("div"); bl.className="blok"+(k.c?"":" bekliyor");
    var dd=document.createElement("div"); dd.className="d";
    var ds=document.createElement("span"); ds.textContent=(k.b||"?")+" · "+trDate(k.t)+(k.c?"":" · cevap bekliyor");
    var rm=document.createElement("button"); rm.className="btn ghost sm"; rm.textContent="kaldır";
    rm.onclick=function(){ draft.konsultasyonlar.splice(i,1); queueSave(true); renderEditor(); render(); };
    dd.appendChild(ds); dd.appendChild(rm);
    var ta=document.createElement("textarea"); ta.rows=2; ta.value=k.c||""; ta.placeholder="Cevap…";
    ta.addEventListener("input",function(){ draft.konsultasyonlar[i].c=ta.value; queueSave(); });
    ta.addEventListener("blur",function(){ render(); });
    bl.appendChild(dd); bl.appendChild(ta); c4.appendChild(bl);
  });
  var kl=document.createElement("div"); kl.className="addline";
  var ki=document.createElement("input"); ki.type="text"; ki.placeholder="Bölüm (Üroloji, Nöroloji…)";
  var kb=document.createElement("button"); kb.className="btn sm"; kb.textContent="İstem ekle";
  var addK=function(){ var v=ki.value.trim(); if(!v) return; draft.konsultasyonlar=draft.konsultasyonlar||[]; draft.konsultasyonlar.push({b:v,t:today(),c:""}); ki.value=""; queueSave(true); renderEditor(); render(); };
  kb.onclick=addK; ki.addEventListener("keydown",function(e){ if(e.key==="Enter") addK(); });
  kl.appendChild(ki); kl.appendChild(kb); c4.appendChild(kl);
  wrap.appendChild(c4);

  wrap.appendChild(blokListe(draft.lablar,"lablar","Lab / tetkik","Sonuçları buraya yapıştır…"));
  wrap.appendChild(blokListe(draft.vizitler,"vizitler","Vizit notları","Bugünkü not…"));

  var hint=document.createElement("div"); hint.className="hint";
  hint.textContent="Yazdıkça kaydedilir. Ad-soyad, TC veya protokol numarası yazma.";
  wrap.appendChild(hint);

  d.appendChild(wrap); d.scrollTop=0;
}
function queueSave(now){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!draft) return;
    var body=payload(draft);
    var i=rows.findIndex(function(n){ return n.id===draft.id; });
    if(i>=0) rows[i]=Object.assign({},rows[i],body); else rows.push(body);
    sortRows(); cacheSet(rows);
    obPush({op:"upsert",id:draft.id,body:body,ts:Date.now()});
    render(); if(navigator.onLine) flush();
  }, now?0:600);
  setSync("Kaydediliyor…","busy");
}
function removeRow(){
  if(!draft) return;
  if(!confirm("Bu hasta kaydı silinsin mi? Geri alınamaz.")) return;
  var id=draft.id;
  rows=rows.filter(function(n){ return n.id!==id; }); cacheSet(rows);
  obPush({op:"delete",id:id,ts:Date.now()});
  currentId=null; draft=null; document.body.dataset.view="list";
  renderEditor(); render(); if(navigator.onLine) flush();
}

/* ---------- vizit modu ---------- */
function vizitList(){ return filtered(); }
function openVizit(i){
  var l=vizitList(); if(!l.length){ alert("Listede hasta yok."); return; }
  vizitIdx=Math.max(0,Math.min(i||0,l.length-1));
  $("vizit").classList.add("on"); renderVizit();
}
function renderVizit(){
  var l=vizitList(); if(!l.length){ $("vizit").classList.remove("on"); return; }
  if(vizitIdx>=l.length) vizitIdx=l.length-1;
  var n=l[vizitIdx];
  $("vPos").textContent=(vizitIdx+1)+" / "+l.length;
  var v=$("vBody"); v.innerHTML="";
  var w=document.createElement("div"); w.className="vw";
  var h=document.createElement("h2");
  h.textContent=(n.oda||"—")+"  ·  "+(n.hasta_kodu||"")+(n.yas?"  "+n.yas:"")+(n.cinsiyet?"/"+n.cinsiyet:"");
  var alt=document.createElement("div"); alt.className="alt";
  alt.textContent=[n.tani,gun(n.yatis_tarihi),n.yatis_tarihi?"yatış "+trDate(n.yatis_tarihi):""].filter(Boolean).join("  ·  ");
  w.appendChild(h); w.appendChild(alt);

  function sec(title,text,cls){
    if(!text) return;
    var s=document.createElement("section");
    var t=document.createElement("h3"); t.textContent=title;
    var p=document.createElement("p"); p.textContent=text; if(cls) p.className=cls;
    s.appendChild(t); s.appendChild(p); w.appendChild(s);
  }
  var bek=(n.isler||[]).filter(function(i){ return !i.ok; }).map(function(i){ return "☐ "+i.m; }).join("\n");
  sec("Bekleyen işler",bek,"bek");
  sec("Öykü",n.oyku);
  sec("Tedavi",n.tedavi);
  sec("FTR programı",n.ftr_program);
  sec("Yapılan işlemler",n.islemler);
  var k=(n.konsultasyonlar||[]).map(function(x){ return x.b+" ("+trDate(x.t)+"): "+(x.c||"cevap bekliyor"); }).join("\n\n");
  sec("Konsültasyonlar",k);
  var lb=(n.lablar||[]).slice(-3).reverse().map(function(x){ return trDate(x.t)+"\n"+x.m; }).join("\n\n");
  sec("Son lab",lb);
  var vz=(n.vizitler||[]).slice(-4).reverse().map(function(x){ return trDate(x.t)+" — "+x.m; }).join("\n\n");
  sec("Vizit notları",vz);

  v.appendChild(w); v.scrollTop=0;
}
$("vizitBtn").onclick=function(){
  var l=vizitList(), i=0;
  if(currentId){ var k=l.findIndex(function(n){ return n.id===currentId; }); if(k>=0) i=k; }
  openVizit(i);
};
$("vClose").onclick=function(){ $("vizit").classList.remove("on"); };
$("vPrev").onclick=function(){ if(vizitIdx>0){ vizitIdx--; renderVizit(); } };
$("vNext").onclick=function(){ if(vizitIdx<vizitList().length-1){ vizitIdx++; renderVizit(); } };
$("vEdit").onclick=function(){
  var n=vizitList()[vizitIdx]; if(!n) return;
  $("vizit").classList.remove("on"); open(n.id);
};
(function(){
  var x0=null;
  var b=$("vBody");
  b.addEventListener("touchstart",function(e){ x0=e.touches[0].clientX; },{passive:true});
  b.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)<70) return;
    if(dx<0) $("vNext").click(); else $("vPrev").click();
  },{passive:true});
})();
document.addEventListener("keydown",function(e){
  if($("vizit").classList.contains("on")){
    if(e.key==="ArrowRight") $("vNext").click();
    if(e.key==="ArrowLeft") $("vPrev").click();
    if(e.key==="Escape") $("vClose").click();
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); if(draft) queueSave(true); }
  if(e.key==="Escape"&&document.body.dataset.view==="detail"&&window.innerWidth<=880) document.body.dataset.view="list";
});

$("menu").onclick=function(){
  var n=obGet().length;
  if(n && !confirm(n+" değişiklik henüz gönderilmedi. Yine de çıkılsın mı?")) return;
  if(!confirm("Bu cihazdan çıkış yapılsın mı? Yerel kopya silinir.")) return;
  localStorage.removeItem(CK); localStorage.removeItem(OK_);
  sb.auth.signOut().then(function(){ location.reload(); });
};

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
boot();
})();
