<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Servis">
<link rel="manifest" href="manifest.webmanifest">
<title>Servis Listesi</title>
<style>
:root{
  --page:#eef2f5; --surface:#ffffff; --surface-2:#f6f8fa;
  --ink:#15222c; --ink-2:#44576a; --ink-3:#7a8a99;
  --line:#dfe5eb; --line-2:#c9d2db;
  --accent:#0e6b66; --accent-ink:#ffffff; --accent-soft:#e0f0ee;
  --warn:#b4461b; --warn-soft:#fdeee6; --ok:#1f7a45;
  --radius:10px; --shadow:0 1px 2px rgba(16,32,44,.05),0 4px 14px rgba(16,32,44,.06);
  --font:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --page:#1b222a; --surface:#232c36; --surface-2:#2a3440;
  --ink:#e3e9ef; --ink-2:#b0bdca; --ink-3:#8494a3;
  --line:#323e4b; --line-2:#3f4c5a;
  --accent:#5cc8bd; --accent-ink:#0b2624; --accent-soft:#1f3c3a;
  --warn:#f0a07f; --warn-soft:#3d2a22; --ok:#86d3a3;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){ :root[data-theme="auto"]{
  --page:#1b222a; --surface:#232c36; --surface-2:#2a3440;
  --ink:#e3e9ef; --ink-2:#b0bdca; --ink-3:#8494a3;
  --line:#323e4b; --line-2:#3f4c5a;
  --accent:#5cc8bd; --accent-ink:#0b2624; --accent-soft:#1f3c3a;
  --warn:#f0a07f; --warn-soft:#3d2a22; --ok:#86d3a3;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;
  -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app{display:none;height:100%;flex-direction:column}
.app.on{display:flex}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{font-weight:700;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand span{color:var(--accent)}
.spacer{flex:1}
.sync{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.sync.busy{color:var(--accent)} .sync.err{color:var(--warn)} .sync.off{color:var(--warn);font-weight:600}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:8px 10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13.5px;min-height:32px}

.panes{flex:1;display:grid;grid-template-columns:minmax(300px,360px) 1fr;min-height:0}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.detail{min-height:0;overflow:auto;background:var(--page)}

.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14.5px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,32,44,.12)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--warn);color:#fff;font-size:12px;line-height:20px}
.tab .cnt:empty{display:none}

.filters{padding:11px 12px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.filters input[type="search"]{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2)}
.segs{display:flex;gap:6px}
.seg{flex:1;padding:6px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.seg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
body[data-tab="is"] .filters .segs{display:none}

.rows{overflow:auto;flex:1;min-height:0}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .l1{display:flex;align-items:baseline;gap:9px}
.oda{font-weight:700;letter-spacing:-.01em;min-width:44px;font-size:17px;color:var(--accent)}
.kim{color:var(--ink);font-size:14.5px;font-weight:500}
.gun{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.row .l2{font-size:14px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l3{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.tag.bek{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600}
.empty{padding:40px 20px;color:var(--ink-3);text-align:center;font-size:14.5px}

/* iş listesi */
.igrp{border-bottom:1px solid var(--line);padding:10px 14px 12px}
.ihead{display:flex;align-items:baseline;gap:9px;width:100%;background:none;border:0;padding:2px 0 6px;cursor:pointer;text-align:left}
.ihead .tn{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ihead .go{color:var(--ink-3);font-size:18px;line-height:1}
.iitem{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.iitem .icheck{display:flex;gap:10px;align-items:flex-start;flex:1;margin:0;color:var(--ink);font-size:inherit;font-weight:400;cursor:pointer;padding:2px 0}
.idel{border:0;background:transparent;color:var(--ink-3);font-size:12.5px;padding:3px 8px;border-radius:6px;cursor:pointer;flex:0 0 auto}
.idel:hover,.idel:focus-visible{color:var(--warn);background:var(--warn-soft)}
.blok .d .idel{margin-left:auto}
.iitem input{margin-top:2px;accent-color:var(--accent);width:20px;height:20px;flex:0 0 auto}
.iitem span{flex:1;font-size:15px}
.iitem.ok span{text-decoration:line-through;color:var(--ink-3)}
.iitem.kons span{color:var(--warn)}
.iitem .dot{width:20px;flex:0 0 auto;display:flex;justify-content:center;padding-top:7px}
.iitem .dot i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:block}
.iadd{display:flex;gap:6px;margin-top:4px}
.iadd input{flex:1;padding:7px 10px;border:1px dashed var(--line-2);border-radius:8px;background:transparent;font-size:14px}
.iadd input:focus{border-style:solid;background:var(--surface-2)}

.editor{max-width:860px;margin:0 auto;padding:18px 16px 80px}
.ed-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ed-head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
.isbtn{border-color:var(--accent);color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.isbtn .cnt{min-width:20px;padding:0 6px;border-radius:999px;background:var(--warn);color:#fff;font-size:12px;line-height:20px;text-align:center}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.card.flash{animation:flash 1.4s ease-out}
.ed-sub{color:var(--ink-2);font-size:14.5px;margin:-8px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.sechead{font-size:12px;font-weight:700;color:var(--accent);margin:0 0 11px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.sechead .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid .half{grid-column:span 2} .grid .full{grid-column:1/-1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2)}
input:focus,select:focus,textarea:focus{background:var(--surface);border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:44px;line-height:1.55}
details.neuro{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
details.neuro summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.blok{border-left:3px solid var(--line-2);padding:2px 0 2px 11px;margin-bottom:11px}
.blok .d{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blok .d b{color:var(--ink);font-weight:600}
.blok .m{white-space:pre-wrap;font-size:14.5px}
.blok.bekliyor{border-left-color:var(--warn)}
.is{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.is input{margin-top:3px;accent-color:var(--accent);width:19px;height:19px;flex:0 0 auto}
.is span{flex:1}
.is.ok span{text-decoration:line-through;color:var(--ink-3)}
.addline{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.addline input[type=text]{flex:1;min-width:140px}
.addline input[type=date]{width:auto;flex:0 0 150px}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}

.vizit{position:fixed;inset:0;background:var(--page);z-index:60;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vizit.on{display:flex}
.vizit .vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.vizit .vbody{flex:1;overflow:auto;padding:16px 16px 40px}
.vizit .vnav{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.vizit .vnav .btn{flex:1;padding:12px}
.vw{max-width:780px;margin:0 auto;font-size:17px}
.vw h2{font-size:25px;margin:0 0 2px;letter-spacing:-.02em}
.vw .alt{color:var(--ink);font-weight:600;font-size:18px;margin-top:4px}
.vw .alt-sub{color:var(--ink-3);font-weight:400;font-size:15px;margin:2px 0 14px}
.vw section{margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow)}
.vw h3{font-size:11.5px;letter-spacing:.07em;color:var(--accent);font-weight:700;margin:0 0 6px}
.vw p{margin:0;white-space:pre-wrap}
.vw .bek{color:var(--warn);font-weight:600}
.vw dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.vw dt{color:var(--ink-3);font-size:14.5px}
.vw dd{margin:0}
.recbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.recpill{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 11px;cursor:pointer;line-height:1.25}
.recpill b{font-size:13.5px;font-weight:600}
.recpill span{font-size:11.5px;color:var(--ink-3)}
.recpill.on{border-color:var(--accent);background:var(--accent-soft)}
.recpill.add,.recpill.tbl{justify-content:center;color:var(--accent);font-weight:600;font-size:13.5px;border-style:dashed}
.recpill.tbl{border-style:solid}
.recinfo{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:12px}
.recinfo input{width:auto}
.recinfo .hint{flex:1;min-width:180px;margin:0 0 6px}
.tplbar,.kgchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tpllbl{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-right:4px;min-width:34px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.sm{padding:4px 10px;font-size:13px}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.kg{margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px 4px}
.kghead{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.kgchips{margin-bottom:8px}
.kgrow{border-top:1px solid var(--line);padding:8px 0}
.kgname{font-size:13.5px;font-weight:600;margin-bottom:5px}
.kgcells{display:flex;gap:6px;flex-wrap:wrap}
.kgcell{display:flex;flex-direction:column;gap:2px;margin:0;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.kgcell select{width:74px;padding:6px 8px}
.kgcell.weak select{border-color:var(--ink-2);font-weight:700}
.kgcell.changed select,.changed input,.changed select,.changed textarea{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.prevhint{font-size:12px;color:var(--warn);margin-top:3px;white-space:pre-wrap}
.prevhint:empty{display:none}
.gtwrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:9px}
.gt{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.gt th,.gt td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.gt th{background:var(--surface-2);font-weight:600;white-space:nowrap}
.gt th small{display:block;font-weight:400;color:var(--ink-3)}
.gt td:first-child{color:var(--ink-2);white-space:nowrap}
.gt td.chg{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.gelisim{border-color:var(--accent)!important}
.gline{display:flex;gap:10px;padding:4px 0;flex-wrap:wrap}
.gl{color:var(--ink-3);min-width:120px;font-size:14.5px}
.gv s{color:var(--ink-3)}
.gv b{color:var(--accent)}
.vnote textarea{font-size:16px;margin-bottom:8px}
.vnote-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.vnote-opt{display:flex;align-items:center;gap:7px;margin:0 auto 0 0;font-size:14px;color:var(--ink-2);cursor:pointer}
.vnote-opt input{width:18px;height:18px;accent-color:var(--accent)}
.vnote .blok{margin-top:10px}
.vw .iitem span{font-size:16.5px}

.sheet{position:fixed;inset:0;background:rgba(10,20,28,.4);z-index:80;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:var(--surface);width:100%;max-width:720px;border-radius:14px 14px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet textarea{height:50vh;font-size:13.5px}
.menu-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.menu-row:last-child{border-bottom:0}
.menu-row .lbl{flex:1;font-weight:500}

.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .box{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.gate h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.gate p.sub{margin:0 0 18px;color:var(--ink-2);font-size:14px}
.gate .field{margin-bottom:11px}
.gate .btn{width:100%;padding:11px;margin-top:6px}
.msg{font-size:13.5px;margin-top:10px;color:var(--warn)} .msg.ok{color:var(--ok)}
.alt2{margin-top:14px;font-size:13.5px;color:var(--ink-2);text-align:center}
.alt2 a{color:var(--accent);cursor:pointer}

.backbtn{display:none}
@media (max-width:880px){
  .panes{grid-template-columns:1fr}
  .list{border-right:0}
  body[data-view="detail"] .list{display:none}
  body[data-view="list"] .detail{display:none}
  body[data-view="detail"] .backbtn{display:inline-flex}
  body[data-view="detail"] .brand{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
  .grid .half{grid-column:span 2}
  .editor{padding:14px 12px 80px}
}
</style>
<script>
(function(){ var t="light"; try{ t=localStorage.getItem("sl_theme")||"light"; }catch(e){} document.documentElement.setAttribute("data-theme",t); })();
</script>
</head>
<body data-view="list" data-tab="hasta">

<div class="gate" id="setupGate" style="display:none">
  <div class="box">
    <h1>Bağlantı bilgileri</h1>
    <p class="sub">Supabase projenin adresi ve anahtarı.</p>
    <div class="field"><label for="cfgUrl">Proje adresi</label><input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></div>
    <div class="field"><label for="cfgKey">Anahtar</label><input type="text" id="cfgKey" placeholder="sb_publishable_..." autocomplete="off"></div>
    <button class="btn primary" id="cfgSave">Bağlan</button>
    <div class="msg" id="cfgMsg"></div>
  </div>
</div>

<div class="gate" id="authGate" style="display:none">
  <div class="box">
    <h1>Servis Listesi</h1>
    <p class="sub" id="authSub">Kayıtlarına ulaşmak için giriş yap.</p>
    <div class="field"><label for="email">E-posta</label><input type="text" id="email" autocomplete="username" inputmode="email"></div>
    <div class="field"><label for="pass">Parola</label><input type="password" id="pass" autocomplete="current-password"></div>
    <button class="btn primary" id="doAuth">Giriş yap</button>
    <div class="msg" id="authMsg"></div>
    <div class="alt2"><a id="toggleMode">Hesabım yok, oluştur</a></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <button class="btn ghost backbtn" id="back" aria-label="Listeye dön">‹ Liste</button>
    <div class="brand">Servis<span>.</span></div>
    <div class="spacer"></div>
    <div class="sync" id="sync"></div>
    <button class="btn sm" id="vizitBtn">Vizit</button>
    <button class="btn primary sm" id="new">+ Hasta</button>
    <button class="btn ghost sm" id="menu" aria-label="Hesap">⋯</button>
  </div>
  <div class="panes">
    <aside class="list">
      <div class="filters">
        <div class="tabs">
          <button class="tab on" data-tab="hasta">Hastalar</button>
          <button class="tab" data-tab="is">İşler<span class="cnt" id="isCount"></span></button>
        </div>
        <input type="search" id="q" placeholder="Ara: oda, kod, tanı, not…" autocomplete="off">
        <div class="segs">
          <button class="seg on" data-d="yatan">Yatanlar</button>
          <button class="seg" data-d="taburcu">Taburcu</button>
          <button class="seg" data-d="hepsi">Hepsi</button>
        </div>
        <div class="hint" id="count"></div>
      </div>
      <div class="rows" id="rows"></div>
    </aside>
    <main class="detail" id="detail"><div class="empty" style="padding-top:56px">Soldan hasta seç ya da yeni hasta ekle.</div></main>
  </div>
</div>

<div class="vizit" id="vizit">
  <div class="vbar">
    <button class="btn ghost" id="vClose">✕ Kapat</button>
    <div class="spacer"></div>
    <div class="sync" id="vPos"></div>
    <button class="btn sm" id="vEdit">Düzenle</button>
  </div>
  <div class="vbody" id="vBody"></div>
  <div class="vnav">
    <button class="btn" id="vPrev">‹ Önceki</button>
    <button class="btn" id="vNext">Sonraki ›</button>
  </div>

/* Resmi tatiller: sabit günler her yıl; dini bayramlar yıl yıl */
var TATIL_SABIT=["01-01","04-23","05-01","05-19","07-15","08-30","10-29"];

function iso(d){ var m=d.getMonth()+1, g=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(g<10?"0":"")+g; }

}

/* ---------- başlat ---------- */
function start(u){
  user=u; CK="sl_cache_"+u.id; OK_="sl_outbox_"+u.id;
  $("app").classList.add("on");
  rows=cacheGet(); sortRows(); render(); setSync();
  window.addEventListener("online", function(){ setSync(); flush().then(pull); });
  window.addEventListener("offline", function(){ setSync(); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && navigator.onLine) flush().then(pull); });
  setInterval(function(){ if(navigator.onLine) flush(); }, 20000);
  if(navigator.onLine) flush().then(pull);
  try{ sb.channel("hastalar-sync").on("postgres_changes",{event:"*",schema:"public",table:"hastalar"},onRemote).subscribe(); }catch(e){}
}

/* ---------- senkron ---------- */
function pull(){
  if(!navigator.onLine) return Promise.resolve();
  return sb.from("hastalar").select("*").then(function(r){
    if(r.error){ lastErr=r.error.message||""; setSync(); return; }
    var pend={}; obGet().forEach(function(o){ pend[o.id]=1; });
    var map={}; rows.forEach(function(n){ map[n.id]=n; });
    var ids={};
    (r.data||[]).forEach(function(s){ ids[s.id]=1; if(!pend[s.id]) map[s.id]=s; });
    rows=Object.keys(map).map(function(k){ return map[k]; }).filter(function(n){ return ids[n.id]||pend[n.id]; });
    sortRows(); cacheSet(rows); setSync(); render();
    if(draft && currentId && !dirty()){ var f=rows.find(function(n){ return n.id===currentId; }); if(f){ draft=prep(clone(f)); renderEditor(true); } }
  }).catch(function(){ setSync(); });
}
function flush(){
  var q=obGet();
  if(!q.length||!navigator.onLine){ setSync(); return Promise.resolve(); }
  var chain=Promise.resolve();
  q.forEach(function(op){
    chain=chain.then(function(){
      var p=op.op==="delete"?sb.from("hastalar").delete().eq("id",op.id):sb.from("hastalar").upsert(op.body);
      return p.then(function(r){
        if(r.error){ lastErr=r.error.message||"hata"; return; }
        lastErr="";
        obSet(obGet().filter(function(x){ return !(x.id===op.id&&x.ts===op.ts); }));
      });
    });
  });
  return chain.then(function(){ setSync(); }).catch(function(){ setSync(); });
}
function onRemote(p){
  var row=p.new&&p.new.id?p.new:p.old; if(!row) return;
  var pend={}; obGet().forEach(function(o){ pend[o.id]=1; });
  if(pend[row.id]) return;
  if(p.eventType==="DELETE"){
    rows=rows.filter(function(n){ return n.id!==row.id; });
    if(currentId===row.id){ currentId=null; draft=null; renderEditor(); }
  }else{
    var i=rows.findIndex(function(n){ return n.id===row.id; });
    if(i>=0) rows[i]=p.new; else rows.push(p.new);
    if(currentId===row.id&&draft&&!dirty()){ draft=prep(clone(p.new)); renderEditor(true); }
  }
  sortRows(); cacheSet(rows); render();
  if($("vizit").classList.contains("on") && document.activeElement && document.activeElement.id!=="vNoteTa") renderVizit(true);
}
function setSync(t,cls){
  var s=$("sync"), n=obGet().length;
  if(t){ s.textContent=t; s.className="sync "+(cls||""); return; }
  if(!navigator.onLine){ s.textContent="Çevrimdışı"+(n?" · "+n+" bekliyor":""); s.className="sync off"; return; }
  if(n&&lastErr){
    s.textContent = /anamnez/i.test(lastErr) ? "Sunucu güncellemesi gerekli (SQL)" : "Gönderilemedi: "+lastErr;
    s.className="sync err"; return;
  }
  if(n){ s.textContent=n+" bekliyor"; s.className="sync busy"; return; }
  s.textContent="Eşitlendi"; s.className="sync";
}

/* ---------- liste ---------- */

}

function bekKons(n){ return (n.konsultasyonlar||[]).filter(function(k){ return !k.c; }).length; }
function filtered(){

    if(durumFilt!=="hepsi"&&(n.durum||"yatan")!==durumFilt) return false;

      JSON.stringify(n.anamnez||{}),JSON.stringify(n.vizitler||[]),JSON.stringify(n.lablar||[])]
      .join(" ").toLocaleLowerCase("tr").indexOf(q)>=0;
  });
}


/* ---------- değerlendirme kayıtları ---------- */
function recs(d){ var a=A(d); return [a].concat(Array.isArray(a.haftalik)?a.haftalik:[]); }
function latestRec(n){ var r=recs(n); return r[r.length-1]||{}; }
function normv(v){ return v==null?"":String(v).trim(); }
function lineMap(t){
  var m={}, o=[];
  String(t||"").split("\n").forEach(function(l){ l=l.trim(); if(!l) return; var i=l.indexOf(":");
    var k=i>0?l.slice(0,i).trim():l, v=i>0?l.slice(i+1).trim():""; if(m[k]===undefined) o.push(k); m[k]=v; });
  return {m:m,o:o};
}
function tplKey(l){ var i=l.indexOf(":"); return (i>0?l.slice(0,i):l).trim(); }
function applyTpl(rec,t){
  Object.keys(t.base||{}).forEach(function(k){ if(!normv(rec[k])) rec[k]=t.base[k]; });
  var have=lineMap(rec.ozel_test).m, add=[];
  (t.tests||[]).forEach(function(l){ if(have[tplKey(l)]===undefined) add.push(l); });
  if(add.length) rec.ozel_test=(normv(rec.ozel_test)?String(rec.ozel_test).replace(/\s+$/,"")+"\n":"")+add.join("\n");
  if(t.neuro) neuroOpen=true;
}
/* şablonu geri al: eklediği testleri ve dokunulmamış varsayılan değerleri kaldırır */
function removeTpl(rec,t){
  var others=Object.keys(TPL).map(function(k){ return TPL[k]; }).filter(function(o){ return o!==t && tplApplied(rec,o); });
  var keep={}; others.forEach(function(o){ (o.tests||[]).forEach(function(l){ keep[tplKey(l)]=1; }); });
  var mine={}; (t.tests||[]).forEach(function(l){ mine[tplKey(l)]=1; });
  rec.ozel_test=String(rec.ozel_test||"").split("\n").filter(function(l){
    if(!l.trim()) return false; var k=tplKey(l); return !mine[k] || keep[k];
  }).join("\n");
  Object.keys(t.base||{}).forEach(function(k){
    if(normv(rec[k])!==normv(t.base[k])) return;
    var yedek=null; others.forEach(function(o){ if(yedek===null && o.base && normv(o.base[k])) yedek=o.base[k]; });
    rec[k]=yedek===null?"":yedek;
  });
}
function tplEdited(rec,t){
  var have=lineMap(rec.ozel_test).m, out=[];
  (t.tests||[]).forEach(function(l){ var k=tplKey(l), i=l.indexOf(":"), def=i>0?l.slice(i+1).trim():"";
    if(have[k]!==undefined && normv(have[k])!==normv(def)) out.push(k+": "+have[k]); });
  return out;
}
function tplApplied(rec,t){
  var have=lineMap(rec.ozel_test).m;
  return (t.tests||[]).length>0 && t.tests.every(function(l){ return have[tplKey(l)]!==undefined; });
}
function kgPairs(rec){
  var out=[], kg=(rec&&rec.kg)||{};
  SIDES.forEach(function(sd){
    [KG_SEG.slice(0,4),KG_SEG.slice(4)].forEach(function(grp){
      var parts=grp.filter(function(sg){ return kg[sd[0]+"_"+sg[0]]; }).map(function(sg){
        var v=kg[sd[0]+"_"+sg[0]];
        return sg[3]+" "+sg[2].map(function(m){ return m+" "+(v[m]||"5")+"/5"; }).join(", ");
      });
      if(parts.length) out.push([sd[2],parts.join("; "),"sp"]);
    });
  });
  return out;
}
/* bir kaydı [etiket, değer] satırlarına aç (gelişim tablosu için) */
function flatRec(r){
  var out=[];
  MKEYS.forEach(function(k){
    if(k==="kg"){
      var kg=r.kg||{};
      SIDES.forEach(function(sd){ KG_SEG.forEach(function(sg){ var v=kg[sd[0]+"_"+sg[0]]; if(!v) return;
        sg[2].forEach(function(m){ out.push([sd[1]+" "+sg[1].toLocaleLowerCase("tr")+" "+m,(v[m]||"5")+"/5"]); }); }); });
      return;
    }
    if(k==="ozel_test"){ var lm=lineMap(r.ozel_test); lm.o.forEach(function(x){ out.push([x,lm.m[x]]); }); return; }
    out.push([LBL[k]||k,normv(r[k])]);
  });
  return out;
}
function recDiffs(p,c){
  var out=[]; if(!p||!c) return out;
  var pm={}; flatRec(p).forEach(function(x){ pm[x[0]]=x[1]; });
  flatRec(c).forEach(function(x){
    if(pm[x[0]]===undefined) return;
    if(normv(pm[x[0]])!==normv(x[1])) out.push([x[0],normv(pm[x[0]]),normv(x[1])]);
  });
  return out;
}
function pairTxt(x){ if(x[2]==="sp") return x[0]+" "+x[1]; return x[1]?x[0]+": "+x[1]:x[0]; }
function recAd(i){ return i===0?"Başvuru":i+". hafta"; }

/* iş kaydını indeks kaymasına karşı metinle doğrula */
function isBul(d,x){ var t=d.isler[x.i]; if(t && t.m===x.it.m) return x.i; for(var k=0;k<d.isler.length;k++){ if(d.isler[k].m===x.it.m) return k; } return -1; }
function isSatiri(n,x){
  var row=document.createElement("div"); row.className="iitem"+(x.it.ok?" ok":"");
  var lb=document.createElement("label"); lb.className="icheck";
  var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!x.it.ok;
  cb.onchange=function(){
    var c=cb.checked;
    mutateRow(n.id,function(d){ var k=isBul(d,x); if(k<0) return; var t=d.isler[k]; t.ok=c; if(c) t.d=today(); else delete t.d; });
  };
  var sp=document.createElement("span"); sp.textContent=x.it.m;
  lb.appendChild(cb); lb.appendChild(sp);
  var del=document.createElement("button"); del.type="button"; del.className="idel"; del.textContent="Sil"; del.setAttribute("aria-label","İşi sil");
  del.onclick=function(){
    if(!confirm("Bu iş silinsin mi?\n\n"+(n.oda?n.oda+" · ":"")+x.it.m)) return;
    mutateRow(n.id,function(d){ var k=isBul(d,x); if(k>=0) d.isler.splice(k,1); });
  };
  row.appendChild(lb); row.appendChild(del);
  return row;
}
function mutateRow(id,fn){
  var i=rows.findIndex(function(n){ return n.id===id; }); if(i<0) return;
  var r=prep(clone(rows[i])); fn(r);
  var body=payload(r);
  rows[i]=Object.assign({},rows[i],body); cacheSet(rows);
  if(draft&&draft.id===id){ fn(draft); renderEditor(true); }
  obPush({op:"upsert",id:id,body:body,ts:Date.now()});
  render(); if($("vizit").classList.contains("on")) renderVizit(true);
  if(navigator.onLine) flush();
}
function renderIsler(){
  var box=$("rows"), q=$("q").value.trim().toLocaleLowerCase("tr"), bugun=today();
  box.innerHTML="";
  var list=rows.filter(function(n){
    if((n.durum||"yatan")!=="yatan") return false;
    if(q && [n.oda,n.hasta_kodu,n.tani,JSON.stringify(n.isler||[])].join(" ").toLocaleLowerCase("tr").indexOf(q)<0) return false;
    return true;
  });
  var shown=0, toplam=0;
  var frag=document.createDocumentFragment();
  list.forEach(function(n){
    var isler=(n.isler||[]).map(function(it,i){ return {it:it,i:i}; });
    var acik=isler.filter(function(x){ return !x.it.ok; });
    var bugunBiten=isler.filter(function(x){ return x.it.ok && x.it.d===bugun; });
    var kons=(n.konsultasyonlar||[]).filter(function(k){ return !k.c; });
    toplam+=acik.length+kons.length;
    if(!acik.length && !kons.length && !bugunBiten.length) return;
    shown++;
    var g=document.createElement("div"); g.className="igrp";
    var h=document.createElement("button"); h.className="ihead"; h.type="button";
    var o=document.createElement("span"); o.className="oda"; o.textContent=n.oda||"—";
    var k=document.createElement("span"); k.className="kim"; k.textContent=[n.hasta_kodu,(n.yas?n.yas:"")+(n.cinsiyet?"/"+n.cinsiyet:"")].filter(Boolean).join(" ");
    var tn=document.createElement("span"); tn.className="tn"; tn.textContent=n.tani||"";
    var go=document.createElement("span"); go.className="go"; go.textContent="›";
    h.appendChild(o); h.appendChild(k); h.appendChild(tn); h.appendChild(go);
    h.onclick=function(){ open(n.id); };
    g.appendChild(h);

    isler.filter(function(x){ return !x.it.ok || x.it.d===bugun; }).forEach(function(x){ g.appendChild(isSatiri(n,x)); });
    kons.forEach(function(kk){
      var r=document.createElement("div"); r.className="iitem kons";
      var dot=document.createElement("div"); dot.className="dot"; dot.appendChild(document.createElement("i"));
      var sp=document.createElement("span"); sp.textContent=(kk.b||"?")+" konsültasyonu — cevap bekliyor ("+trDate(kk.t)+")";
      r.appendChild(dot); r.appendChild(sp); g.appendChild(r);
    });

    var ad=document.createElement("div"); ad.className="iadd";
    var ai=document.createElement("input"); ai.type="text"; ai.placeholder="+ iş ekle";
    ai.addEventListener("keydown",function(e){
      if(e.key!=="Enter") return;
      var v=ai.value.trim(); if(!v) return;
      mutateRow(n.id,function(d){ d.isler.push({m:v,ok:false}); });
    });
    ad.appendChild(ai); g.appendChild(ad);
    frag.appendChild(g);
  });
  $("count").textContent=toplam?toplam+" bekleyen iş":"";
  if(!shown){
    var e=document.createElement("div"); e.className="empty";
    e.textContent=list.length?"Bekleyen iş yok.":"Yatan hasta yok.";
    box.appendChild(e);
    var hint=document.createElement("div"); hint.className="hint"; hint.style.textAlign="center";
    hint.textContent="İş eklemek için hastayı açıp Bekleyen işler bölümünü kullan.";
    if(list.length) box.appendChild(hint);
    return;
  }
  box.appendChild(frag);
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
  t.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){ x.classList.remove("on"); });
    t.classList.add("on"); tab=t.dataset.tab; document.body.dataset.tab=tab;
    $("q").placeholder = tab==="is" ? "Ara: oda, kod, iş…" : "Ara: oda, kod, tanı, not…";
    render();
  };
});
function render(){
  updIsCount();
  if(tab==="is"){ renderIsler(); return; }
  var list=filtered(), box=$("rows");
  $("count").textContent=list.length+" hasta";
  box.innerHTML="";
  if(!list.length){
    var e=document.createElement("div"); e.className="empty";
    e.textContent=rows.length?"Bu filtreye uyan hasta yok.":"Liste boş. Sağ üstten hasta ekle.";
    box.appendChild(e); return;
  }
  var frag=document.createDocumentFragment();
  list.forEach(function(n){
    var b=document.createElement("button"); b.className="row"; b.type="button";
    if(n.id===currentId) b.setAttribute("aria-current","true");
    var l1=document.createElement("div"); l1.className="l1";
    var o=document.createElement("span"); o.className="oda"; o.textContent=n.oda||"—";
    var k=document.createElement("span"); k.className="kim";
    k.textContent=[n.hasta_kodu,(n.yas?n.yas:"")+(n.cinsiyet?"/"+n.cinsiyet:"")].filter(Boolean).join(" ");
    var g=document.createElement("span"); g.className="gun"; g.textContent=n.durum==="taburcu"?"taburcu":gunTxt(n);
    l1.appendChild(o); l1.appendChild(k); l1.appendChild(g);
    var l2=document.createElement("div"); l2.className="l2"; l2.textContent=[n.tani||A(n).sikayet||"—",(n.durum||"yatan")==="yatan"?seansTxt(n):""].filter(Boolean).join("  ·  ");
    var l3=document.createElement("div"); l3.className="l3";
    var bi=bekleyen(n), bk=bekKons(n);
    if(bi){ var t1=document.createElement("span"); t1.className="tag bek"; t1.textContent=bi+" iş"; l3.appendChild(t1); }
    if(bk){ var t2=document.createElement("span"); t2.className="tag bek"; t2.textContent=bk+" konsültasyon bekliyor"; l3.appendChild(t2); }
    var an=latestRec(n);
    if(an.fas!==undefined&&an.fas!==""){ var t4=document.createElement("span"); t4.className="tag"; t4.textContent="FAS "+an.fas; l3.appendChild(t4); }
    if(an.gya){ var t5=document.createElement("span"); t5.className="tag"; t5.textContent="GYA "+an.gya.toLocaleLowerCase("tr"); l3.appendChild(t5); }
    b.appendChild(l1); b.appendChild(l2); if(l3.children.length) b.appendChild(l3);
    b.onclick=function(){ open(n.id); };
    frag.appendChild(b);
  });
  box.appendChild(frag);
}

/* ---------- editör ---------- */
function prep(d){
  if(!d.anamnez||typeof d.anamnez!=="object") d.anamnez={};
  if(!d.anamnez.hikaye && d.oyku) d.anamnez.hikaye=d.oyku;
  if(!Array.isArray(d.anamnez.goruntuleme)) d.anamnez.goruntuleme=[];
  if(!Array.isArray(d.anamnez.haftalik)) d.anamnez.haftalik=[];
  ["lablar","konsultasyonlar","vizitler","isler"].forEach(function(k){ if(!Array.isArray(d[k])) d[k]=[]; });
  return d;
}
function blank(){
  return prep({id:uid(),user_id:user.id,oda:"",hasta_kodu:"",yas:null,cinsiyet:"",yatis_tarihi:today(),
    durum:"yatan",taburcu_tarihi:null,tani:"",oyku:"",tedavi:"",ftr_program:"",islemler:"",
    lablar:[],konsultasyonlar:[],vizitler:[],isler:[],
    anamnez:{bilinc:"Açık, oryante, koopere",idrar:"Kontinan",goruntuleme:[]}});
}
function payload(d){
  var an=d.anamnez||{};
  return {id:d.id,user_id:user.id,oda:d.oda||"",hasta_kodu:d.hasta_kodu||"",
    yas:(d.yas===""||d.yas==null)?null:+d.yas,cinsiyet:d.cinsiyet||"",
    yatis_tarihi:d.yatis_tarihi||null,durum:d.durum||"yatan",taburcu_tarihi:d.taburcu_tarihi||null,
    tani:d.tani||"",oyku:an.hikaye||d.oyku||"",tedavi:d.tedavi||"",ftr_program:d.ftr_program||"",islemler:d.islemler||"",
    lablar:d.lablar||[],konsultasyonlar:d.konsultasyonlar||[],vizitler:d.vizitler||[],isler:d.isler||[],
    anamnez:an};
}
function dirty(){
  if(!draft) return false;
  var o=rows.find(function(n){ return n.id===draft.id; });
  if(!o) return true;
  return JSON.stringify(payload(prep(clone(o))))!==JSON.stringify(payload(draft));
}
function open(id){
  var n=rows.find(function(x){ return x.id===id; }); if(!n) return;
  currentId=id; draft=prep(clone(n)); isNew=false;
  selRec=draft.anamnez.haftalik.length; neuroOpen=false; showTable=false;
  document.body.dataset.view="detail"; renderEditor(); render();
}
$("new").onclick=function(){
  draft=blank(); currentId=draft.id; isNew=true; selRec=0; neuroOpen=false; showTable=false;
  rows.push(payload(draft)); sortRows(); cacheSet(rows);
  document.body.dataset.view="detail"; renderEditor(); render();
  var f=document.querySelector('[data-f="oda"]'); if(f) f.focus();
};
$("back").onclick=function(){ document.body.dataset.view="list"; };

/* alan üretici: src "a" ise anamnez nesnesine yazar */
function field(label,key,type,opts){
  opts=opts||{};
  var tgt=function(){ return opts.rec?opts.rec:(opts.a?draft.anamnez:draft); };
  var w=document.createElement("div"); if(opts.cls) w.className=opts.cls;
  var l=document.createElement("label"); l.textContent=label;
  var el, cur=tgt()[key];
  if(type==="select"){
    el=document.createElement("select");
    opts.list.forEach(function(v){ var o=document.createElement("option"); o.value=v; o.textContent=v===""?"—":v; el.appendChild(o); });
    el.value=(cur==null)?"":String(cur);
  }else if(type==="textarea"){
    el=document.createElement("textarea"); el.value=cur||""; el.rows=opts.rows||2;
  }else{
    el=document.createElement("input"); el.type=type;
    if(type==="number"){ if(!opts.neg){ el.min=0; el.max=opts.max||120; el.inputMode="numeric"; } }
    el.value=(cur==null)?"":cur;
  }
  if(opts.ph) el.placeholder=opts.ph;
  el.dataset.f=key;
  var hint=null, upd=function(){};
  if(opts.prev){
    hint=document.createElement("div"); hint.className="prevhint";
    upd=function(){
      var pv=opts.prev[key], cv=tgt()[key], ch=false, txt="";
      if(key==="ozel_test"){
        var A1=lineMap(pv).m, B1=lineMap(cv), fark=[];
        B1.o.forEach(function(k){ if(A1[k]!==undefined && normv(A1[k])!==normv(B1.m[k])) fark.push(k+": "+(A1[k]||"—")); });
        ch=fark.length>0; txt=fark.join(" · ");
      }else{ ch=normv(pv)!==normv(cv); txt=normv(pv)||"—"; }
      w.classList.toggle("changed",ch); hint.textContent=ch?"Önceki: "+txt:"";
    };
  }
  if(type==="textarea"&&opts.grow){ var fit=function(){ el.rows=Math.min(24,Math.max(opts.rows||2,String(el.value).split("\n").length+1)); }; fit(); el.addEventListener("input",fit); }
  el.addEventListener("input",function(){ tgt()[key]=el.value; queueSave(); updTitle(); upd(); });
  w.appendChild(l); w.appendChild(el); if(hint){ w.appendChild(hint); upd(); } return w;
}

  var h=document.createElement("div"); h.className="sechead";

  c.appendChild(h); c._head=h; return c;

/* tarihli blok listesi (görüntüleme, lab, vizit) */
function blokListe(getArr,title,opts){
  opts=opts||{};
  var c=card(title);
  var arr=getArr();
  arr.slice().reverse().forEach(function(t,ri){
    var i=arr.length-1-ri;
    var b=document.createElement("div"); b.className="blok";
    var d=document.createElement("div"); d.className="d";
    var ds=document.createElement("span"); ds.textContent=trDate(t.t);
    d.appendChild(ds);
    if(t.b){ var bb=document.createElement("b"); bb.textContent=t.b; d.appendChild(bb); }
    var rm=document.createElement("button"); rm.className="btn ghost sm"; rm.textContent="kaldır";
    rm.onclick=function(){ if(!confirm("Kaldırılsın mı?")) return; getArr().splice(i,1); queueSave(true); renderEditor(true); };
    d.appendChild(rm);
    var m=document.createElement("div"); m.className="m"; m.textContent=t.m;
    b.appendChild(d); b.appendChild(m); c.appendChild(b);
  });
  var line=document.createElement("div"); line.className="addline";
  var di=document.createElement("input"); di.type="date"; di.value=today();
  var bi=null;
  if(opts.baslik){ bi=document.createElement("input"); bi.type="text"; bi.placeholder=opts.baslik; line.appendChild(bi); }
  line.appendChild(di);
  var ta=document.createElement("textarea"); ta.rows=3; ta.placeholder=opts.ph||""; ta.style.marginTop="8px";
  var add=document.createElement("button"); add.className="btn sm"; add.textContent="Ekle"; add.style.marginTop="8px";
  add.onclick=function(){
    var v=ta.value.trim(); if(!v) return;
    var o={t:di.value||today(),m:v}; if(bi&&bi.value.trim()) o.b=bi.value.trim();
    var a=getArr(); a.push(o); a.sort(function(x,y){ return x.t<y.t?-1:x.t>y.t?1:0; });
    queueSave(true); renderEditor(true);
  };
  c.appendChild(line); c.appendChild(ta); c.appendChild(add);
  return c;
}

function gelisimTablosu(d){
  var RL=recs(d), cols=RL.map(function(r){ var m={}; flatRec(r).forEach(function(x){ m[x[0]]=x[1]; }); return m; });
  var order=[], seen={};
  RL.forEach(function(r){ flatRec(r).forEach(function(x){ if(!seen[x[0]]){ seen[x[0]]=1; order.push(x[0]); } }); });
  var rowsT=order.filter(function(k){
    var vals=cols.map(function(c){ return normv(c[k]); });
    return vals.some(function(v){ return v!==""; }) && vals.some(function(v){ return v!==vals[0]; });
  });
  var wrapT=document.createElement("div"); wrapT.className="gtwrap";
  if(!rowsT.length){ var e=document.createElement("div"); e.className="hint"; e.textContent="Değerlendirmeler arasında henüz değişen bulgu yok."; wrapT.appendChild(e); return wrapT; }
  var tbl=document.createElement("table"); tbl.className="gt";
  var thead=document.createElement("tr"); var th0=document.createElement("th"); th0.textContent="Bulgu"; thead.appendChild(th0);
  RL.forEach(function(r,i){ var th=document.createElement("th"); th.textContent=recAd(i); var sm=document.createElement("small"); sm.textContent=trDate(recTarih(d,i)); th.appendChild(sm); thead.appendChild(th); });
  tbl.appendChild(thead);
  rowsT.forEach(function(k){
    var tr=document.createElement("tr"); var td0=document.createElement("td"); td0.textContent=k; tr.appendChild(td0);
    cols.forEach(function(c,i){
      var td=document.createElement("td"); var v=normv(c[k]); td.textContent=v||"—";
      if(i>0 && v!==normv(cols[i-1][k]) && v!=="") td.className="chg";
      tr.appendChild(td);
    });
    tbl.appendChild(tr);
  });
  wrapT.appendChild(tbl);
  return wrapT;
}

/* ---------- metin üretimi ---------- */
function muayeneSatirlari(a){
  a=a||{}; var out=[];
  MUAYENE.forEach(function(m){
    var k=m[0], lab=m[1], v="";
    if(k==="_kg"){ kgPairs(a).forEach(function(p){ out.push(p); }); return; }
    if(k==="ozel_test"){
      String(a.ozel_test||"").split("\n").forEach(function(line){
        line=line.trim(); if(!line) return; var i=line.indexOf(":");
        if(i>0){ var val=line.slice(i+1).trim(); if(val) out.push([line.slice(0,i).trim(),val]); }
        else out.push([line,""]);
      });
      return;
    }
    if(k==="_vas"){
      var p=[]; if(normv(a.vas_ist)) p.push("İSTİRAHAT: "+a.vas_ist);
      if(normv(a.vas_har)) p.push("HAREKET: "+a.vas_har);
      if(normv(a.vas_gece)) p.push("GECE: "+a.vas_gece);
      v=p.join("  ");
    }else if(k==="_refleks"){
      var q=[]; if(a.dtr) q.push("DTR: "+a.dtr); if(a.babinski) q.push("BABİNSKİ: "+a.babinski); if(a.hoffmann) q.push("HOFFMANN: "+a.hoffmann);
      v=q.join("  ");
    }else if(k==="_oturma"){
      var o=[]; if(a.oturma_kisa) o.push("KISA OTURMA: "+a.oturma_kisa); if(a.oturma_uzun) o.push("UZUN OTURMA: "+a.oturma_uzun);
      v=o.join("  ");
    }else if(k==="_gya"){
      v=[a.gya,a.gya_not].filter(Boolean).join(" — ");
    }else{ v=a[k]; }
    if(k==="brunnstrom" && /^\s*Ü:\s*E:\s*A:\s*$/i.test(normv(v))) v="";
    if(normv(v)!=="") out.push([lab,String(v)]);
  });
  return out;
}
function anamnezMetni(n){
  var a=A(n), L=[];
  L.push(trDate(today()));
  L.push("YAŞ/CİNSİYET: "+(n.yas?n.yas+" Y":"")+(n.cinsiyet?" / "+n.cinsiyet:""));
  if(a.sikayet) L.push("ŞİKAYET: "+a.sikayet);
  if(a.hikaye) L.push("HİKAYE: "+a.hikaye);
  L.push("ÖZGEÇMİŞ: "+(a.ozgecmis||""));
  L.push("SOYGEÇMİŞ: "+(a.soygecmis||""));
  L.push("İLAÇLAR: "+(n.tedavi||""));
  L.push(""); L.push("MUAYENE VE DEĞERLENDİRME");
  muayeneSatirlari(a).forEach(function(x){ L.push(pairTxt(x)); });
  var gr=(a.goruntuleme||[]);
  if(gr.length){ L.push(""); L.push("GÖRÜNTÜLEME:"); gr.forEach(function(x){ L.push(""); L.push(trDate(x.t)+(x.b?" "+x.b:"")+":"); L.push(x.m); }); }
  return L.join("\n");
}
function haftaMetni(c,p,i){
  var L=[trDate(c.t||today())+" "+i+". HAFTA DEĞERLENDİRMESİ",""];
  muayeneSatirlari(c).forEach(function(x){ L.push(pairTxt(x)); });
  var d=recDiffs(p,c);
  if(d.length){ L.push(""); L.push("GELİŞİM (ÖNCEKİ DEĞERLENDİRMEYE GÖRE):"); d.forEach(function(x){ L.push("- "+x[0]+": "+(x[1]||"—")+" → "+(x[2]||"—")); }); }
  return L.join("\n");
}
function copyAnamnez(){
  var RL=recs(draft), t;
  if(selRec===0) t=anamnezMetni(payload(draft));
  else t=haftaMetni(RL[selRec],RL[selRec-1],selRec);
  var show=function(){ $("sheetText").value=t; $("sheet").classList.add("on"); setTimeout(function(){ $("sheetText").select(); },50); };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(function(){ setSync("Kopyalandı","busy"); setTimeout(function(){ setSync(); },1500); }, show);
  }else show();
}

/* ---------- kayıt ---------- */
function queueSave(now){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    saveTimer=null;
    if(!draft) return;
    var body=payload(draft);
    var i=rows.findIndex(function(n){ return n.id===draft.id; });
    if(i>=0) rows[i]=Object.assign({},rows[i],body); else rows.push(body);
    sortRows(); cacheSet(rows);
    obPush({op:"upsert",id:draft.id,body:body,ts:Date.now()});
    render(); if(navigator.onLine) flush();
  }, now?0:600);
  setSync("Kaydediliyor…","busy");
}
function removeRow(){
  if(!draft) return;
  if(!confirm("Bu hasta kaydı silinsin mi? Geri alınamaz.")) return;
  var id=draft.id;
  rows=rows.filter(function(n){ return n.id!==id; }); cacheSet(rows);
  obPush({op:"delete",id:id,ts:Date.now()});
  currentId=null; draft=null; document.body.dataset.view="list";
  renderEditor(); render(); if(navigator.onLine) flush();
}

          k=-1; for(var j=dd.vizitler.length-1;j>=0;j--){ if(dd.vizitler[j].m===o.x.m && dd.vizitler[j].t===o.x.t){ k=j; break; } }
        }
        if(k>=0) dd.vizitler.splice(k,1);
      });
    };
    d.appendChild(dl);
    var m=document.createElement("div"); m.className="m"; m.textContent=o.x.m;
    b.appendChild(d); b.appendChild(m); sv.appendChild(b);
  });
  w.appendChild(sv);
  var gAnchor=document.createElement("div"); w.appendChild(gAnchor);
  sec("ŞİKAYET",a.sikayet);
  sec("HİKAYE",a.hikaye);
  var oz=[a.ozgecmis?"Özgeçmiş: "+a.ozgecmis:"",a.soygecmis?"Soygeçmiş: "+a.soygecmis:""].filter(Boolean).join("\n");
  sec("ÖZGEÇMİŞ / SOYGEÇMİŞ",oz);
  sec("İLAÇLAR",n.tedavi);

  var RLv=recs(prep(clone(n))), curR=RLv[RLv.length-1], prR=RLv.length>1?RLv[RLv.length-2]:null;
  var ms=muayeneSatirlari(curR);
  if(ms.length){
    var s=document.createElement("section");
    var t=document.createElement("h3");
    t.textContent="MUAYENE VE DEĞERLENDİRME"+(RLv.length>1?" · "+(RLv.length-1)+". HAFTA "+trDate(curR.t):"");
    s.appendChild(t);
    var dl=document.createElement("dl");
    var KS={"VAS":"VAS","FAS":"FAS","ROM":"ROM","DTR":"DTR","GÜNLÜK YAŞAM AKTİVİTELERİ":"GYA","MKF SIKMA":"MKF sıkma","KAS GÜCÜ":"Kas gücü"};
    ms.forEach(function(x){
      var dt=document.createElement("dt"); dt.textContent=KS[x[0]]||(x[0].charAt(0)+x[0].slice(1).toLocaleLowerCase("tr"));
      var dd=document.createElement("dd"); dd.textContent=x[1]||"✓";
      dl.appendChild(dt); dl.appendChild(dd);
    });
    s.appendChild(dl); w.appendChild(s);
  }
  var fk=recDiffs(prR,curR);
  if(fk.length){
    var sg=document.createElement("section"); sg.className="gelisim";
    var tg=document.createElement("h3"); tg.textContent="GELİŞİM · "+(RLv.length>2?(RLv.length-2)+". HAFTAYA":"BAŞVURUYA")+" GÖRE"; sg.appendChild(tg);
    fk.forEach(function(x){
      var r=document.createElement("div"); r.className="gline";
      var a=document.createElement("span"); a.className="gl"; a.textContent=x[0];
      var b=document.createElement("span"); b.className="gv";
      var o=document.createElement("s"); o.textContent=x[1]||"—";
      var y=document.createElement("b"); y.textContent=x[2]||"—";
      b.appendChild(o); b.appendChild(document.createTextNode(" → ")); b.appendChild(y);
      r.appendChild(a); r.appendChild(b); sg.appendChild(r);
    });
    w.insertBefore(sg,gAnchor);
  }
  var gr=(a.goruntuleme||[]).slice().reverse().map(function(x){ return trDate(x.t)+(x.b?" · "+x.b:"")+"\n"+x.m; }).join("\n\n");
  sec("GÖRÜNTÜLEME",gr);
  sec("YAPILAN İŞLEMLER",n.islemler);
  var k=(n.konsultasyonlar||[]).map(function(x){ return x.b+" ("+trDate(x.t)+"): "+(x.c||"cevap bekliyor"); }).join("\n\n");
  sec("KONSÜLTASYONLAR",k);
  var lb=(n.lablar||[]).slice(-3).reverse().map(function(x){ return trDate(x.t)+"\n"+x.m; }).join("\n\n");
  sec("SON LAB",lb);


  v.appendChild(w); v.scrollTop=keep?st0:0;
}

(function(){
  var x0=null, y0=null, b=$("vBody");
  b.addEventListener("touchstart",function(e){ if(e.target.closest("textarea,input,label")){ x0=null; return; } x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  b.addEventListener("touchend",function(e){
    if(x0===null) return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)) return;

  },{passive:true});
})();
document.addEventListener("keydown",function(e){
  if($("vizit").classList.contains("on")){
    var ae=document.activeElement; if(ae && /^(TEXTAREA|INPUT)$/.test(ae.tagName)){ if(e.key==="Escape") ae.blur(); return; }
    if(e.key==="ArrowRight") $("vNext").click();
    if(e.key==="ArrowLeft") $("vPrev").click();
    if(e.key==="Escape") $("vClose").click();
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); if(draft) queueSave(true); }
  if(e.key==="Escape"&&document.body.dataset.view==="detail"&&window.innerWidth<=880) document.body.dataset.view="list";
});

function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{ localStorage.setItem("sl_theme",t); }catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll("[data-th]"),function(b){ b.classList.toggle("on",b.dataset.th===t); });
  var dark = t==="dark" || (t==="auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", dark?"#232c36":"#ffffff");
}
applyTheme(document.documentElement.getAttribute("data-theme")||"light");
Array.prototype.forEach.call(document.querySelectorAll("[data-th]"),function(b){ b.onclick=function(){ applyTheme(b.dataset.th); }; });
